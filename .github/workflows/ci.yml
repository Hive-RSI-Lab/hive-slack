name: ci
# Runs .hive/project.json's test on GitHub's standard hosted runner of this public repo, free
# without a minute cap (the person, 10-29: "no caps or high caps"); no larger or paid runners.
# The Hive reads the job as "test (ubuntu-latest)" (forge_tests in .hive/project.json); keep
# the job unnamed and the matrix as it is so that name holds.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  # A PR's superseded run is cancelled; every push to main keeps a group of its own.
  group: ci-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: the suite (go test ./...)
        shell: bash
        run: go test ./... 2>&1 | tee "$RUNNER_TEMP/suite.log"; test "${PIPESTATUS[0]}" = 0
      # Job logs need a login; annotations don't, so the Hive can read what failed.
      - name: name the failing tests
        if: failure()
        shell: bash
        run: |
          grep -n -e '--- FAIL' -e '^panic:' -e '^FAIL' "$RUNNER_TEMP/suite.log" | head -20 | while IFS=: read -r n _; do
            echo "::error::$(sed -n "$n,$((n + 30))p" "$RUNNER_TEMP/suite.log" | awk 'BEGIN { ORS = "%0A" } { gsub(/\r/, ""); gsub(/%/, "%25"); print substr($0, 1, 300) }')"
          done
